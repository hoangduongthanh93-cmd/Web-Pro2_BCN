<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Fashion Store</title>
    <link rel="stylesheet" href="../CSS/trangdangnhap.css">
    <link rel="stylesheet" href="../CSS/header/dungchung.css">
    <script src="../JS/trangdangnhap.js" defer></script>
</head>
<body>
    <div id="header"></div>

    <main class="container_xacthuc">
        <div class="Hop">
            <h1 class="DangnhapTaiKhoan_Titlte">Đăng nhập</h1>
            <form id="Form_DANGNHAP" class="bieuMau_XacThuc">
                <div class="O_DANGNHAP">
                    <label for="DangnhapEmail">Email</label>
                    <input type="email" id="DangnhapEmail" required placeholder="Nhập địa chỉ email">
                </div>

                <div class="O_DANGNHAP">
                    <label for="DangnhapPassword">Mật khẩu</label>
                    <input type="password" id="DangnhapPassword" required placeholder="Nhập mật khẩu">
                </div>

                <button type="submit" class="auth-btn">Đăng nhập</button>
            </form>

            <p class="DoiPhuongThuc">
                Chưa có tài khoản? <a href="../HTML/trangdangky.html">Đăng ký ngay</a>
            </p>
        </div>
    </main>

    <div id="footer"></div>
    <script src="../JS/Dungchung/dungchung.js"></script>
</body>
</html>
