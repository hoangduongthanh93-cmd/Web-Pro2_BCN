<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Fashion Store</title>
    <link rel="stylesheet" href="../CSS/trangdangky.css">
    <link rel="stylesheet" href="../CSS/header/dungchung.css">
    <script src="../JS/trangdangky.js" defer></script>
</head>
<body>
    <div id="header"></div>

    <main class="container_xacthuc">
        <div class="Hop">
            <h1 class="DangkyTaiKhoan_Titlte">Đăng ký tài khoản</h1>
            <form id="Form_DANGKY" class="bieuMau_XacThuc">
                <div class="O_DANGKY">
                    <label for="DangkyUSer_Name">Họ và tên</label>
                    <input type="text" id="TenDangKY" required placeholder="Nhập họ và tên">
                </div>

                <div class="O_DANGKY">
                    <label for="DangkyUSer_Email">Email</label>
                    <input type="email" id="DangkyUSer_Email" required placeholder="Nhập địa chỉ email">
                </div>

                <div class="O_DANGKY">
                    <label for="DangkyUSer_Password">Mật khẩu</label>
                    <input type="password" id="DangkyUSer_Password" required placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)">
                </div>

                <button type="submit" class="Nut_DangKy">Đăng ký</button>
            </form>

            <p class="DoiPhuongThuc">
                Đã có tài khoản? <a href="../HTML/trangdangnhap.html">Đăng nhập ngay</a>
            </p>
        </div>
    </main>

    <div id="footer"></div>
    <script src="../JS/Dungchung/dungchung.js"></script>
</body>
</html>
